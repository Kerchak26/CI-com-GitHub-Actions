name: Teste de API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-api:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Testes
        run: pytest test_main.py

      - name: Subir a API e testar requisição (Integração)
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/
          curl -f http://localhost:8000/somar/10/20

  check-final:
    runs-on: ubuntu-latest
    needs: [verificar-api] # substitua pelo nome real do seu job que tem a matrix
    steps:
      - run: echo "Todos os testes da matrix passaram!"